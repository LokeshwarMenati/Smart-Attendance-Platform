spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:smart_attendance;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.smartattendance: DEBUG
    org.springframework.security: INFO

app:
  business:
    office-start-time: ${OFFICE_START_TIME:09:00}
    late-threshold-minutes: ${LATE_THRESHOLD_MINUTES:15}

management:
  endpoint:
    health:
      show-details: always
