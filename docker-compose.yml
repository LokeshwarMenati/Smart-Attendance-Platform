services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-attendance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_attendance}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-attendance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_attendance}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-4c9e89d6b2a14e9f848a3182d3856bcf2911b617d5a570087799b82873130c24}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-UTC}
      SPRING_PROFILES_ACTIVE: postgres
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-attendance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
